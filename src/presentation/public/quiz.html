<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulacro Médico - Hub Academia</title>
    <!-- ✅ PÁGINA PRIVADA/SESIÓN: Deshabilitar indexación en motores de búsqueda -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS Moderno (Glassmorphism) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Centralized Design System Tokens -->
    <link rel="stylesheet" href="/css/theme.css?v=725839fb">
    <link rel="stylesheet" href="/css/quiz.css?v=725839fb">
    <link rel="stylesheet" href="/css/modal.css?v=725839fb">
    <link rel="stylesheet" href="/css/components.css?v=725839fb">
    <link rel="stylesheet" href="/css/tutor.css?v=725839fb">
    <link rel="stylesheet" href="/css/markdown-content.css?v=725839fb">
    <script src="/js/config.js?v=725839fb"></script>
    <script src="/js/utils/themeManager.js?v=725839fb"></script>
</head>

<body class="quiz-body">

    <!-- Pantalla de Carga (Glassmorphism UI) -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-card">
            <div class="premium-spinner"></div>
            <h2 id="loadingTitle" class="loading-title">Preparando simulacro...</h2>
            <p id="loadingSubtitle" class="loading-subtitle" style="margin-bottom: 2.5rem;">Consultando fuentes oficiales y configurando preguntas...</p>
            
            <!-- Tip Box Dinámico -->
            <div class="tip-box" style="background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 1.5rem; border: 1px dashed rgba(255,255,255,0.1); margin: 0 auto; max-width: 320px;">
                <p style="color: #3b82f6; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em;">¿Sabías que?</p>
                <p id="loadingTip" style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; transition: opacity 0.5s ease; opacity: 0;">Cargando tips de estudio...</p>
            </div>
        </div>
    </div>

    <!-- Contenedor del Quiz -->
    <div class="quiz-container">
        <div class="question-header">
            <div class="header-progress-group">
                <span class="question-count-label">
                    Pregunta <span id="currentQ">1</span>/<span id="maxQ">10</span>
                </span>
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>
            <div class="header-right-actions">
                <div class="timer-badge" style="display: none;">
                    <i class="fas fa-clock"></i>
                    <span id="timer">45s</span>
                </div>
                <button id="btn-top-exit" class="btn-header-exit" title="Pausar y Salir del Simulacro">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Salir</span>
                </button>
            </div>
        </div>

        <div id="questionLayout" class="question-layout-grid">
            <div id="questionImageContainer" class="q-image-container-premium" style="display: none;">
                <img id="questionImage" src="" alt="Imagen de contexto" loading="lazy">
            </div>

            <div class="question-text" id="questionText">
                Cargando pregunta...
            </div>
        </div>

        <div class="options-grid" id="optionsGrid">
            <!-- Botones generados por JS -->
        </div>

        <div id="feedbackBox" class="feedback-box" style="display: none;">
            <h5 id="explanation-title" class="mb-3" style="color: #60a5fa; font-weight: 700; letter-spacing: -0.02em;">
                <i class="fas fa-info-circle"></i> Sustento Técnico
            </h5>
            <div id="explanationText" style="font-size: 1.15rem; line-height: 1.6; color: #93c5fd; margin-bottom: 1.5rem;"></div>
            <div id="explanationImageContainer" class="q-explanation-image-container-premium" style="display: none;">
                <img id="explanationImage" src="" alt="Imagen explicativa" loading="lazy">
            </div>
        </div>

        <div id="nextBtnContainer" class="next-btn-container" style="display: none;">
            <button id="btn-open-quiz-tutor" class="btn-tutor-ai-action" type="button" style="display: none;">
                <img src="/assets/hubifrente.png" alt="Hubi" style="width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; margin-right: 6px;">
                <span>Consultar Tutor IA</span>
            </button>
            <button id="nextBtn" class="btn-next-premium" type="button">
                Siguiente Pregunta <i class="fas fa-arrow-right" style="margin-left: 0.5rem;"></i>
            </button>
        </div>

        <!-- Contenedor Post-Examen (Hidden) -->
        <div id="reviewContainer" class="review-container" style="display: none;">
            <div class="review-header">
                <h2><i class="fas fa-clipboard-check"></i> Corrección de Simulacro</h2>
                <button id="btn-top-exit" class="btn-top-exit"><i class="fas fa-times"></i> Salir</button>
            </div>
            <div id="reviewFeed" class="review-feed">
                <!-- Tarjetas inyectadas por JS -->
            </div>
        </div>
    </div>

    <!-- Modal de Resultados -->
    <div id="resultsOverlay" class="results-overlay">
        <div class="results-card">
            <h2 style="margin-bottom: 1rem;">¡Simulacro Finalizado!</h2>
            <div class="score-circle-svg-container" id="scoreCircle">
                <svg viewBox="0 0 100 100" class="svg-score-chart">
                    <!-- Aro estático de fondo -->
                    <circle class="svg-circle-bg" cx="50" cy="50" r="45"></circle>
                    <!-- Aro animado de progreso -->
                    <circle class="svg-circle-progress" id="svgScoreProgress" cx="50" cy="50" r="45"></circle>
                </svg>
                <span class="score-value" id="finalScore">0/10</span>
            </div>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">¿Qué te pareció el nivel?</p>

            <div class="results-actions">
                <button id="btn-review-exam" type="button" onclick="event.preventDefault(); window.showExamReview(); return false;" class="btn-results-review">
                    <i class="fas fa-clipboard-check"></i> Ver Corrección del Examen
                </button>
                <div class="results-secondary-actions">
                    <button id="btn-exit-quiz" class="btn-secondary">
                        <i class="fas fa-sign-out-alt"></i> Salir
                    </button>
                    <button onclick="window.startNewExam()" class="btn-secondary">
                        <i class="fas fa-redo"></i> Nuevo Examen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Visor Lightbox Premium para Imágenes -->
    <div id="lightboxModal" class="lightbox-modal">
        <button class="lightbox-close" id="lightboxClose" title="Cerrar (Esc)"><i class="fas fa-times"></i></button>
        <div class="lightbox-controls">
            <button id="lightboxZoomOut" title="Alejar"><i class="fas fa-minus"></i></button>
            <button id="lightboxZoomReset" title="Restaurar (1:1)"><i class="fas fa-sync-alt"></i></button>
            <button id="lightboxZoomIn" title="Acercar"><i class="fas fa-plus"></i></button>
        </div>
        <div class="lightbox-viewport" id="lightboxViewport">
            <img id="lightboxImage" src="" alt="Vista ampliada" draggable="false">
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js?v=725839fb"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/utils/markdown-renderer.js?v=725839fb"></script>
    <script src="/js/services/networkService.js?v=725839fb"></script>
    <script src="/js/services/authApiService.js?v=725839fb"></script>
    <script src="/js/services/analyticsApiService.js?v=725839fb"></script>
    <script src="/js/sessionManager.js?v=725839fb"></script>
    <script src="/js/ui/components.js?v=725839fb"></script>
    <script src="/js/ui/confirmationModal.js?v=725839fb"></script>
    <script src="/js/ui/uiManager.js?v=725839fb"></script>
    <script src="/js/app.js?v=725839fb"></script>
    <script src="/js/quiz-tutor.js?v=725839fb"></script>
    <script type="module" src="/js/quiz.js?v=725839fb"></script>
</body>

</html>
