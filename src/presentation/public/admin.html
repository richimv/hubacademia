    <script>
        (function () {
            try {
                var token = localStorage.getItem('authToken');
                if (!token || token === 'null' || token === 'undefined') {
                    window.location.replace('/');
                    return;
                }
                var parts = token.split('.');
                if (parts.length !== 3) {
                    localStorage.removeItem('authToken');
                    window.location.replace('/');
                    return;
                }
                var base64Url = parts[1];
                var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                var jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                var payload = JSON.parse(jsonPayload);
                if (!payload.exp || (Date.now() / 1000 > payload.exp)) {
                    localStorage.removeItem('authToken');
                    window.location.replace('/');
                    return;
                }
                var adminEmails = ['hubacademia01@gmail.com'];
                var email = (payload.email || (payload.user_metadata && payload.user_metadata.email) || '').toLowerCase();
                var appRole = (payload.app_metadata && payload.app_metadata.role) || payload.role;
                if (!adminEmails.includes(email) && appRole !== 'admin') {
                    window.location.replace('/');
                    return;
                }
            } catch (err) {
                window.location.replace('/');
                return;
            }
        })();
    </script>
