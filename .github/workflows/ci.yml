name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      GOOGLE_CLOUD_PROJECT: mock-gcp-project
      GOOGLE_CLOUD_LOCATION: us-central1
      SUPABASE_URL: https://mock-supabase.supabase.co
      SUPABASE_ANON_KEY: mock-anon-key
      SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Verify deterministic frontend artifacts are committed
        run: git diff --exit-code -- src/presentation/public
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m compileall -q ml_service
